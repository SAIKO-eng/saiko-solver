name: 'publish'

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/version.txt'

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  release_policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.policy.outputs.should_release }}
      version: ${{ steps.policy.outputs.version }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6

      - name: Check release channel
        id: policy
        shell: bash
        run: |
          version=$(tr -d '\r\n' < public/version.txt)
          ref="${GITHUB_REF}"
          should_release=false
          prerelease=false
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::Invalid release version: $version"
            exit 1
          fi
          if [[ "$ref" == "refs/heads/main" ]]; then
            should_release=true
            [[ "$version" =~ -rc[0-9]+$ ]] && prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Release policy: ref=$ref version=$version should_release=$should_release prerelease=$prerelease"

  build-tauri:
    needs: release_policy
    if: needs.release_policy.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-index-

      - name: Get version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release_policy.outputs.version }}
        run: |
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate runtime identity configuration
        run: pnpm run check:runtime-identity

      - name: Validate i18n
        run: pnpm run i18n:check

      - name: Run frontend and build-tool tests
        run: |
          pnpm test
          pnpm run test:identity-audit
          pnpm run test:packaged-identity

      - name: Build frontend
        run: pnpm run build

      - name: Rust format
        run: |
          cargo fmt --package discord-cdp-launch-core --package discord-cdp-launcher -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --locked --workspace

      - name: Verify CDP core dependency boundary
        run: pnpm run check:cdp-core-deps

      - name: Sync version from public/version.txt
        run: pnpm run sync-version

      - name: Build runner sidecar
        env:
          TAURI_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: pnpm run build:runner

      - name: Build Discord CDP launcher sidecar
        env:
          TAURI_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: pnpm run build:cdp-launcher

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: -- --locked

      - name: Stage Windows portable artifact
        shell: pwsh
        run: |
          $portableDir = 'build/windows-portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item 'target/release/saiko-solver.exe' "$portableDir/saiko-solver.exe"
          Copy-Item 'src-tauri/binaries/waybridge-x86_64-pc-windows-msvc.exe' "$portableDir/waybridge.exe"

      - name: Upload Windows artifact (portable)
        uses: actions/upload-artifact@v7
        with:
          name: tauri-win-portable
          path: build/windows-portable/*

      - name: Upload Windows artifact (MSI)
        uses: actions/upload-artifact@v7
        with:
          name: tauri-win-msi
          path: target/release/bundle/msi/*.msi

  release:
    needs:
      - release_policy
      - build-tauri
    if: >-
      needs.release_policy.outputs.should_release == 'true' &&
      needs.build-tauri.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: get version
        id: extract_version
        env:
          RELEASE_VERSION: ${{ needs.release_policy.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.release_policy.outputs.prerelease }}
        run: |
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_ENV"
          printf 'PRERELEASE=%s\n' "$RELEASE_PRERELEASE" >> "$GITHUB_ENV"

      - name: Download Windows artifact (portable)
        uses: actions/download-artifact@v8
        with:
          name: tauri-win-portable
          path: tauri-win-portable

      - name: Download Windows artifact (MSI)
        uses: actions/download-artifact@v8
        with:
          name: tauri-win-msi
          path: tauri-win-msi

      - name: prepare files
        env:
          VERSION: ${{ env.version }}
        run: |
          version="$VERSION"
          mkdir -p ./build
          cd tauri-win-portable
          zip -r "../build/SAIKO-SOLVER-Windows-x64-$version-portable.zip" .
          cd ..
          cp tauri-win-msi/*.msi "./build/SAIKO-SOLVER-Windows-x64-$version-setup.msi"
          echo "win_portable=SAIKO-SOLVER-Windows-x64-$version-portable" >> $GITHUB_ENV
          echo "win_msi=SAIKO-SOLVER-Windows-x64-$version-setup" >> $GITHUB_ENV

      - name: Create and Upload Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.version }}
          name: ${{ env.version }}
          body_path: ./public/version-desc.txt
          files: |
            ./build/${{ env.win_portable }}.zip
            ./build/${{ env.win_msi }}.msi
          prerelease: ${{ env.PRERELEASE }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release
        run: gh release edit "${{ env.version }}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}